name: Observer Cross-Platform Release Candidates

on:
  pull_request:
    paths:
      - .github/workflows/observer-release-candidates.yml
      - integrations/basecamp/**
      - integrations/basecamp-ui/**
      - logos-repo.json
  workflow_dispatch:
    inputs:
      publish:
        description: Publish signed Core and UI packages to GitHub Releases
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.module }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    strategy:
      fail-fast: true
      matrix:
        include:
          - module: core
            variant: darwin-arm64
            runner: macos-15
          - module: core
            variant: linux-amd64
            runner: ubuntu-24.04
          - module: ui
            variant: darwin-arm64
            runner: macos-15
          - module: ui
            variant: linux-amd64
            runner: ubuntu-24.04

    steps:
      - name: Checkout Observer
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build and verify package
        env:
          MODULE: ${{ matrix.module }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          set -euo pipefail

          DEST="$RUNNER_TEMP/$MODULE-$VARIANT.lgx"

          if [[ "$MODULE" == core && "$VARIANT" == darwin-arm64 ]]; then
            ./integrations/basecamp/scripts/package-portable-macos.sh "$DEST"
          else
            if [[ "$MODULE" == core ]]; then
              SOURCE="./integrations/basecamp"
            else
              SOURCE="./integrations/basecamp-ui"
            fi

            case "$VARIANT" in
              darwin-arm64) SYSTEM="aarch64-darwin" ;;
              linux-amd64) SYSTEM="x86_64-linux" ;;
              *) echo "Unsupported variant: $VARIANT" >&2; exit 1 ;;
            esac

            OUTPUT_DIR="$(nix build -L --no-link --print-out-paths "$SOURCE#packages.$SYSTEM.lgx-portable")"
            PKG="$(find "$OUTPUT_DIR" -maxdepth 2 -type f -name '*.lgx' -print -quit)"
            test -n "$PKG"
            cp "$PKG" "$DEST"
          fi

          test -s "$DEST"

          nix run github:logos-co/logos-package#lgx -- verify "$DEST"

          echo "PASS: $MODULE / $VARIANT"

      - name: Upload package candidate
        uses: actions/upload-artifact@v4
        with:
          name: observer-candidate-${{ matrix.module }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/${{ matrix.module }}-${{ matrix.variant }}.lgx
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Merge and verify ${{ matrix.module }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      matrix:
        module:
          - core
          - ui

    steps:
      - name: Checkout Observer
        uses: actions/checkout@v4

      - name: Download platform candidates
        uses: actions/download-artifact@v4
        with:
          pattern: observer-candidate-${{ matrix.module }}-*
          path: candidates
          merge-multiple: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Merge and verify variants
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail

          LGX_DIR="$(nix build --no-link --print-out-paths 'github:logos-co/logos-package#lgx')"
          LGX="$LGX_DIR/bin/lgx"

          MAC="candidates/$MODULE-darwin-arm64.lgx"
          LINUX="candidates/$MODULE-linux-amd64.lgx"
          OUT="output/$MODULE.lgx"

          test -s "$MAC"
          test -s "$LINUX"
          mkdir -p output

          "$LGX" merge "$MAC" "$LINUX" -o "$OUT" -y
          "$LGX" verify "$OUT"

          if [[ "$MODULE" == core ]]; then
            META="integrations/basecamp/metadata.json"
          else
            META="integrations/basecamp-ui/metadata.json"
          fi

          NAME="$(jq -r .name "$META")"
          VERSION="$(jq -r .version "$META")"

          "$LGX" manifest "$OUT" --json |
            jq -e --arg name "$NAME" --arg version "$VERSION" '
              .name == $name and
              .version == $version and
              (.main | has("darwin-arm64") and has("linux-amd64"))
            '

          test -z "$("$LGX" signature "$OUT")"

          echo "PASS: $NAME v$VERSION"
          echo "PASS: Both portable variants included"
          echo "PASS: Package ready for protected signing"

      - name: Upload merged release candidate
        uses: actions/upload-artifact@v4
        with:
          name: observer-merged-${{ matrix.module }}
          path: output/${{ matrix.module }}.lgx
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Protected Observer Release Signing
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: merge
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4

      - name: Download merged packages
        uses: actions/download-artifact@v4
        with:
          pattern: observer-merged-*
          path: unsigned
          merge-multiple: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Sign and verify Observer packages
        shell: bash
        env:
          KEY_JWK: ${{ secrets.OBSERVER_RELEASE_JWK }}
        run: |
          set -euo pipefail
          umask 077

          test -n "${KEY_JWK:-}" || {
            echo "Missing protected signing secret" >&2
            exit 1
          }

          LGX_DIR="$(nix build --no-link --print-out-paths 'github:logos-co/logos-package#lgx')"
          LGX="$LGX_DIR/bin/lgx"

          KEY_DIR="$RUNNER_TEMP/observer-signing-keys"
          TRUST_DIR="$RUNNER_TEMP/observer-trust"

          mkdir -p "$KEY_DIR" "$TRUST_DIR" signed
          trap 'rm -rf "$KEY_DIR"' EXIT

          printf '%s' "$KEY_JWK" > "$KEY_DIR/observer-release.jwk"
          unset KEY_JWK

          DID="$(jq -er '.trustedSigners[] | select(.name == "Observer Release") | .did' logos-repo.json)"

          "$LGX" keyring add observer-release "$DID" \
            --dir "$TRUST_DIR"

          for module in core ui; do
            SOURCE="unsigned/$module.lgx"
            DEST="signed/$module.lgx"

            test -s "$SOURCE"
            cp "$SOURCE" "$DEST"

            "$LGX" verify "$DEST"

            "$LGX" sign "$DEST" \
              --key observer-release \
              --keys-dir "$KEY_DIR" \
              --name "Observer Release" \
              --url "https://github.com/0xterricola/observer"

            "$LGX" verify "$DEST" \
              --keyring-dir "$TRUST_DIR"

            ACTUAL="$("$LGX" signature "$DEST" | jq -er .did)"
            test "$ACTUAL" = "$DID"

            echo "PASS: Signed and verified Observer $module"
          done

      - name: Upload signed candidates
        uses: actions/upload-artifact@v4
        with:
          name: observer-signed-multiplatform
          path: signed/*.lgx
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish signed Observer releases
    needs: sign
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: observer-release-publishing
      cancel-in-progress: false

    steps:
      - name: Checkout Observer
        uses: actions/checkout@v4

      - name: Download signed packages
        uses: actions/download-artifact@v4
        with:
          name: observer-signed-multiplatform
          path: signed

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Verify packages and prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          LGX_DIR="$(nix build --no-link --print-out-paths 'github:logos-co/logos-package#lgx')"
          LGX="$LGX_DIR/bin/lgx"

          TRUST="$RUNNER_TEMP/observer-release-trust"
          mkdir -p "$TRUST" dist

          DID="$(jq -er '.trustedSigners[] | select(.name == "Observer Release") | .did' logos-repo.json)"
          "$LGX" keyring add observer-release "$DID" --dir "$TRUST"

          for module in core ui; do
            if [[ "$module" == core ]]; then
              META="integrations/basecamp/metadata.json"
              EXPECTED_NAME="observer"
            else
              META="integrations/basecamp-ui/metadata.json"
              EXPECTED_NAME="observer_ui"
            fi

            NAME="$(jq -er .name "$META")"
            VERSION="$(jq -er .version "$META")"
            test "$NAME" = "$EXPECTED_NAME"

            SOURCE="signed/$module.lgx"
            TARGET_DIR="dist/$NAME"
            TARGET="$TARGET_DIR/$NAME-$VERSION.lgx"
            TAG="$NAME-v$VERSION"

            test -s "$SOURCE"
            mkdir -p "$TARGET_DIR"
            cp "$SOURCE" "$TARGET"

            "$LGX" verify "$TARGET" --keyring-dir "$TRUST"

            MANIFEST="$("$LGX" manifest "$TARGET" --json)"
            SIGNATURE="$("$LGX" signature "$TARGET")"

            jq -e \
              --arg name "$NAME" \
              --arg version "$VERSION" \
              '.name == $name and
               .version == $version and
               (.main | has("darwin-arm64") and has("linux-amd64"))' \
              <<< "$MANIFEST" >/dev/null

            jq -e --arg did "$DID" \
              '.did == $did' <<< "$SIGNATURE" >/dev/null

            SHA="$(sha256sum "$TARGET" | awk '{print $1}')"
            SIZE="$(stat -c%s "$TARGET")"
            ROOT="$(jq -r '.hashes.root // ""' <<< "$MANIFEST")"

            jq -n \
              --arg publisherRef "$TAG" \
              --arg releasedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg sha256 "$SHA" \
              --argjson size "$SIZE" \
              --arg rootHash "$ROOT" \
              --argjson manifest "$MANIFEST" \
              --argjson signature "$SIGNATURE" \
              '{
                publisherRef: $publisherRef,
                releasedAt: $releasedAt,
                sha256: $sha256,
                size: $size,
                rootHash: $rootHash,
                builtVariants: ["darwin-arm64", "linux-amd64"],
                missingVariants: [],
                manifest: $manifest,
                signature: $signature
              }' > "$TARGET_DIR/sidecar.json"

            echo "$TAG" > "$TARGET_DIR/tag.txt"

            echo "PASS: $TAG verified and staged"
          done

      - name: Refuse existing release versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          for module in observer observer_ui; do
            TAG="$(cat "dist/$module/tag.txt")"

            if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              echo "::error::Release already exists: $TAG"
              exit 1
            fi

            if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag already exists: $TAG"
              exit 1
            fi

            echo "PASS: $TAG is not already published"
          done

      - name: Stage signed releases as drafts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          for module in observer observer_ui; do
            TAG="$(cat "dist/$module/tag.txt")"

            gh release create "$TAG" \
              "dist/$module/"*.lgx \
              "dist/$module/sidecar.json" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "${TAG/-v/ v}" \
              --notes "Signed portable release for macOS ARM64 and Linux x86-64." \
              --latest=false \
              --draft

            echo "PASS: Staged $TAG as draft"
          done

      - name: Verify staged release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          for module in observer observer_ui; do
            TAG="$(cat "dist/$module/tag.txt")"
            VERSION="${TAG#"$module"-v}"
            PACKAGE="$module-$VERSION.lgx"

            gh release view "$TAG" \
              --repo "$GH_REPO" \
              --json isDraft,assets \
              | jq -e --arg package "$PACKAGE" '
                  .isDraft == true and
                  ([.assets[].name] | sort) ==
                  ([$package, "sidecar.json"] | sort)
                ' >/dev/null

            echo "PASS: $TAG contains both required assets"
          done

      - name: Publish verified drafts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          for module in observer observer_ui; do
            TAG="$(cat "dist/$module/tag.txt")"

            gh release edit "$TAG" \
              --repo "$GH_REPO" \
              --draft=false \
              --latest=false

            echo "PASS: Published $TAG"
          done

      - name: Request Basecamp catalogue rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api \
            -X POST \
            "repos/$GH_REPO/dispatches" \
            -f event_type=rebuild-index

          echo "PASS: Catalogue index rebuild requested"
