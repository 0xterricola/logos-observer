name: Release Observer UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Observer UI
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    with:
      module_path: integrations/basecamp-ui
      variants: darwin-arm64
      signing_mode: none
      skip_if_published: true
